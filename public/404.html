<!doctype html>

    <title>404 — Halaman tidak ditemukan | Sirna</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #F5F5F7; color: #1D1D1F; padding: 24px;
      }
      main { text-align: center; max-width: 420px; }
      .code {
        display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .08em;

        border: 1px solid rgba(0, 113, 227, .2); border-radius: 999px; padding: 6px 14px;
      }
      h1 { font-size: 28px; line-height: 1.25; margin: 20px 0 10px; letter-spacing: -.02em; }
      p { font-size: 16px; line-height: 1.6; color: #6E6E73; margin: 0 0 28px; }
      a {
        display: inline-block; text-decoration: none; font-weight: 600; font-size: 16px;
        color: #fff; background: #0071E3; border-radius: 12px; padding: 13px 26px;
      }
      a:hover { background: #0077ED; }
      .note { margin-top: 28px; font-size: 13px; color: #86868B; }
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #F5F5F7; }
        p { color: #A1A1A6; }
        .note { color: #6E6E73; }
      }
    </style>
  </head>

    <main>
